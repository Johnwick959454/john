services:
  postgres:
    image: postgres:15-alpine
    container_name: covenant_shield_postgres
    restart: always
    environment:
      POSTGRES_USER: covenant_admin
      POSTGRES_PASSWORD: covenant_password
      POSTGRES_DB: covenant_shield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
